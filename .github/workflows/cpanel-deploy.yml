name: Deploy to cPanel

on:
  push:
    branches:
      - prod
      - production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build SvelteKit App
        run: npm run build
        env:
          DATABASE_URL: "mysql://dummy:dummy@localhost:3306/dummy"

      - name: Prepare Deployment Folder
        run: |
          mkdir deploy
          cp -r build deploy/
          cp package.json deploy/
          cp package-lock.json deploy/ || true
          cp app.cjs deploy/
          mkdir -p deploy/tmp
          touch deploy/tmp/restart.txt

      - name: Sync Files to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./deploy/
          # No exclusions needed since we only put exactly what we need in the deploy folder!