name: Deploy to cPanel

on:
  push:
    branches:
      - prod
      - production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build SvelteKit App
        run: npm run build
        env:
          DATABASE_URL: "mysql://dummy:dummy@localhost:3306/dummy"

      - name: Trigger App Restart (Create tmp/restart.txt)
        run: |
          mkdir -p tmp
          touch tmp/restart.txt

      - name: Remove Dev Dependencies (Shrink node_modules)
        run: |
          rm -rf node_modules
          npm install --omit=dev

      - name: Sync Files to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          # Exclude files we don't want on the production server to save time
          exclude: |
            **/.git*
            **/.git*/**
            **/tests/**
            **/.github/**
            src/**
            static/**
